name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Least privilege: nothing in CI needs to write to the repository.
permissions:
  contents: read

# Superseded pushes to the same ref cancel their in-flight runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  hygiene:
    name: Format & Tidy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: gofmt
        run: make fmt-check

      - name: go mod tidy
        run: make tidy-check

      - name: go vet
        run: make vet

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # Config lives in .golangci.yml; the version is pinned so a new
      # golangci-lint release cannot red-CI an unrelated pull request.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  unit-test:
    name: Unit Tests (race + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # This package fans out over errgroup pools and shares caches across
      # goroutines; -race is not optional here.
      - name: Run unit tests
        run: make cover

      # Always visible, needs nothing configured: the totals land on the run's
      # own summary page. Until now the profile was uploaded as an artifact and
      # never looked at, which is measurement without reporting.
      - name: Report coverage
        # always(), so a failing test run still reports what it did cover — but
        # only if the profile exists, or this step fails on top of the failure
        # that actually matters.
        if: always()
        run: |
          if [ ! -s coverage.out ]; then
            echo "no coverage profile was produced" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '## Coverage'
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
            echo
            echo '<details><summary>Per function</summary>'
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

      # A short run per target. Enough to catch a target that no longer builds
      # or whose seed corpus now fails. The campaign that actually searches for
      # crashes is .github/workflows/fuzz.yml, nightly and out of band.
      - name: Fuzz smoke run
        run: make fuzz

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # govulncheck reports only vulnerabilities that are actually reachable
      # from this code, so a finding here is a call path worth looking at rather
      # than a version-range match in a dependency nobody calls.
      - name: Run govulncheck
        run: make vulncheck

  e2e-container:
    name: E2E against a real OCI registry
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # The tests start their own registry:2 container; pre-pull it so the
      # in-test readiness poll is not racing a cold image pull.
      - name: Pre-pull registry image
        run: docker pull registry:2

      - name: Run E2E container tests
        run: make e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Build binary
        run: make build
